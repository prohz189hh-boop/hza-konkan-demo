name: Demo tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run demo tests
        run: npm test

      - name: Run MIT rules package tests
        working-directory: packages/konkan-rules
        run: |
          npm install --ignore-scripts
          npm test
          npm run typecheck
          npm run lint
          npm run coverage

      - name: Verify sanitized export
        run: python3 tools/verify_demo.py
